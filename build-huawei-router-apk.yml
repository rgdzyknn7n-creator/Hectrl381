name: Build Huawei Router Manager APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/hectrl381/router
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/values

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "HuaweiRouterManager"
          include(":app")
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.hectrl381.router'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.hectrl381.router'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > android/app/src/main/res/xml/network_security_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true" />
          </network-security-config>
          EOF

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#2563EB</item>
                  <item name="android:statusBarColor">#0B0F14</item>
                  <item name="android:navigationBarColor">#0B0F14</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:label="Huawei Router Manager"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:networkSecurityConfig="@xml/network_security_config">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > android/app/src/main/java/com/hectrl381/router/MainActivity.java <<'EOF'
          package com.hectrl381.router;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              private WebView webView;
              private EditText ipInput;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  showHome();
              }

              private int dp(int value) {
                  return (int) (value * getResources().getDisplayMetrics().density + 0.5f);
              }

              private TextView text(String value, float size, int color) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setGravity(Gravity.CENTER);
                  return t;
              }

              private void showHome() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(24), dp(24), dp(24), dp(24));
                  root.setBackgroundColor(Color.rgb(11, 15, 20));

                  TextView title = text("📡 Huawei Router", 30, Color.WHITE);
                  root.addView(title, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(70)));

                  TextView sub = text("لوحة تحكم الراوتر", 19, Color.LTGRAY);
                  root.addView(sub, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(55)));

                  TextView model = text(
                          "Huawei 5G CPE Pro 5\\nH158-381\\n\\nتحكم كامل بواجهة الراوتر الأصلية",
                          18, Color.WHITE);
                  root.addView(model, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(170)));

                  ipInput = new EditText(this);
                  ipInput.setSingleLine(true);
                  ipInput.setText("192.168.8.1");
                  ipInput.setTextColor(Color.WHITE);
                  ipInput.setHintTextColor(Color.GRAY);
                  ipInput.setHint("IP الراوتر");
                  root.addView(ipInput, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(60)));

                  Button open = new Button(this);
                  open.setText("فتح التحكم الكامل بالراوتر");
                  open.setOnClickListener(v -> openRouter());
                  root.addView(open, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(60)));

                  Button info = new Button(this);
                  info.setText("معلومات");
                  info.setOnClickListener(v -> {
                      TextView msg = text(
                              "صل الجهاز بنفس شبكة الراوتر ثم اضغط فتح التحكم.\\n\\n" +
                              "سيتم فتح واجهة Huawei الأصلية داخل التطبيق، وبالتالي تستطيع استخدام إعدادات الشبكة والواي فاي والأجهزة والأدوات وغيرها.",
                              16, Color.WHITE);
                      msg.setPadding(dp(20), dp(20), dp(20), dp(20));
                      setContentView(msg);
                  });
                  root.addView(info, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(55)));

                  setContentView(root);
              }

              private void openRouter() {
                  String ip = ipInput.getText().toString().trim();

                  if (ip.isEmpty()) {
                      ip = "192.168.8.1";
                  }

                  if (!ip.startsWith("http://") && !ip.startsWith("https://")) {
                      ip = "http://" + ip;
                  }

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  webView.setWebViewClient(new WebViewClient());

                  setContentView(webView);
                  webView.loadUrl(ip);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      showHome();
                  }
              }
          }
          EOF

          cd android
          gradle wrapper --gradle-version 8.9
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Huawei-Router-Manager
          path: android/app/build/outputs/apk/debug/app-debug.apk
