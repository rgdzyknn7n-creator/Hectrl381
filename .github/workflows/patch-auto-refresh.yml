name: Patch 1s auto refresh
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Enable 1s auto refresh') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch polling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/java/com/hectrl381/router/MainActivity.java')
          s=p.read_text()
          s=s.replace('import android.os.Bundle;','import android.os.Bundle;\nimport android.os.Handler;\nimport android.os.Looper;')
          s=s.replace('private Map<String,String> lastData = new LinkedHashMap<>();','private Map<String,String> lastData = new LinkedHashMap<>();\n    private final Handler refreshHandler = new Handler(Looper.getMainLooper());\n    private volatile boolean refreshInFlight = false;\n    private boolean autoRefresh = false;\n    private final Runnable refreshLoop = () -> refreshData();')
          s=s.replace('@Override protected void onDestroy(){io.shutdownNow();super.onDestroy();}','@Override protected void onDestroy(){stopAutoRefresh();io.shutdownNow();super.onDestroy();}')
          s=s.replace('login();runOnUiThread(this::dashboard);refreshData();','login();runOnUiThread(()->{dashboard();startAutoRefresh();});')
          start=s.index('    private void refreshData(){')
          end=s.index('    private void add(',start)
          new='''    private void startAutoRefresh(){autoRefresh=true;refreshHandler.removeCallbacks(refreshLoop);refreshHandler.post(refreshLoop);}\n    private void stopAutoRefresh(){autoRefresh=false;refreshHandler.removeCallbacks(refreshLoop);}\n    private void refreshData(){\n        if(refreshInFlight)return;\n        refreshInFlight=true;\n        io.execute(()->{try{Map<String,String>m=new LinkedHashMap<>();add(m,get("/api/monitoring/status"),new String[]{"ConnectionStatus","CurrentNetworkType","CurrentNetworkTypeEx","SignalIcon","CurrentWifiUser"});add(m,get("/api/device/signal"),new String[]{"rsrp","rsrq","sinr","rssi","nrrsrp","nrrsrq","nrsinr","nrrssi","band","pci","scc_pci","cell_id","enodeb_id","nrearfcn","lteearfcn"});add(m,get("/api/net/current-plmn"),new String[]{"FullName","ShortName","Numeric","Rat","NetworkName","plmn"});add(m,get("/api/device/information"),new String[]{"DeviceName","SoftwareVersion","SerialNumber","Imei"});add(m,get("/api/monitoring/traffic-statistics"),new String[]{"CurrentDownloadRate","CurrentUploadRate","TotalDownload","TotalUpload","CurrentConnectTime"});add(m,get("/api/net/net-mode"),new String[]{"NetworkMode","LTEBand","NRBand","NetworkBand"});lastData=m;runOnUiThread(()->{dashboardWith(m);if(autoRefresh)refreshHandler.postDelayed(refreshLoop,1000);});}catch(Exception e){runOnUiThread(()->{toast("تعذر تحديث البيانات: "+e.getMessage());if(autoRefresh)refreshHandler.postDelayed(refreshLoop,1000);});}finally{refreshInFlight=false;}});\n    }\n'''
          s=s[:start]+new+s[end:]
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app/src/main/java/com/hectrl381/router/MainActivity.java
          git commit -m 'Enable 1s auto refresh' || exit 0
          git push
      - name: Remove helper workflow
        if: success()
        run: |
          rm -f .github/workflows/patch-auto-refresh.yml
          git add .github/workflows/patch-auto-refresh.yml
          git commit -m 'Remove temporary refresh patch workflow' || exit 0
          git push
