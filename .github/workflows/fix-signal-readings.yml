name: Fix signal readings
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Fix signal parsing') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch signal parsing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/hectrl381/router/MainActivity.java')
          s=p.read_text()
          old='private void add(Map<String,String>m,String x,String[]names){for(String n:names){String v=tag(x,n);if(!v.isEmpty())m.put(n,v);}}'
          new='''private void add(Map<String,String>m,String x,String[]names){for(String n:names){String v=tagCI(x,n);if(!v.isEmpty())m.put(n,v);}}\n    private String tagCI(String xml,String name){\n        if(xml==null||xml.isEmpty()||name==null)return "";\n        try{Pattern p=Pattern.compile("<\\\\s*"+Pattern.quote(name)+"\\\\s*>(.*?)</\\\\s*"+Pattern.quote(name)+"\\\\s*>",Pattern.CASE_INSENSITIVE|Pattern.DOTALL);Matcher q=p.matcher(xml);if(q.find())return q.group(1).trim();}\n        catch(Exception ignored){}\n        return "";\n    }'''
          if old not in s:
              raise SystemExit('target add() method not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app/src/main/java/com/hectrl381/router/MainActivity.java
          git commit -m 'Fix signal parsing' || exit 0
          git push
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/fix-signal-readings.yml
          git add .github/workflows/fix-signal-readings.yml
          git commit -m 'Remove temporary signal patch workflow' || exit 0
          git push
