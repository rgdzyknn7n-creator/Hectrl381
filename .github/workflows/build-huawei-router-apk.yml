name: Build Huawei Router Manager APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/hectrl381/router
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/values

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "HuaweiRouterManager"
          include(":app")
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.hectrl381.router'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.hectrl381.router'
                  minSdk 23
                  targetSdk 35
                  versionCode 3
                  versionName '3.0'
              }
          }
          EOF

          cat > android/app/src/main/res/xml/network_security_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true" />
          </network-security-config>
          EOF

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#3B82F6</item>
                  <item name="android:statusBarColor">#070B10</item>
                  <item name="android:navigationBarColor">#070B10</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="false" android:label="Huawei Router Manager" android:theme="@style/AppTheme" android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml/network_security_config">
                  <activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android/app/src/main/java/com/hectrl381/router/MainActivity.java <<'EOF'
          package com.hectrl381.router;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              private WebView web;
              private EditText ip;
              private int dp(int n) { return (int)(n * getResources().getDisplayMetrics().density + .5f); }

              private TextView title(String s, float size) {
                  TextView t = new TextView(this);
                  t.setText(s); t.setTextSize(size); t.setTextColor(Color.WHITE);
                  t.setGravity(Gravity.CENTER); t.setPadding(dp(8),dp(8),dp(8),dp(8));
                  return t;
              }

              private Button button(String s) {
                  Button b = new Button(this); b.setText(s); b.setTextSize(15);
                  b.setTextColor(Color.WHITE); b.setAllCaps(false);
                  b.setBackgroundColor(Color.rgb(37,99,235));
                  b.setLayoutParams(new LinearLayout.LayoutParams(-1, dp(56)));
                  return b;
              }

              @Override public void onCreate(Bundle state) { super.onCreate(state); home(); }

              private void home() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL); root.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.setPadding(dp(18),dp(22),dp(18),dp(22)); root.setBackgroundColor(Color.rgb(7,11,16));
                  root.addView(title("📡 Huawei Router Manager",25), new LinearLayout.LayoutParams(-1,dp(70)));
                  root.addView(title("H158-381 • تحكم بالراوتر",16), new LinearLayout.LayoutParams(-1,dp(45)));

                  ip = new EditText(this); ip.setSingleLine(true); ip.setText("192.168.8.1");
                  ip.setHint("IP الراوتر"); ip.setTextColor(Color.WHITE); ip.setHintTextColor(Color.GRAY); ip.setGravity(Gravity.CENTER);
                  root.addView(ip,new LinearLayout.LayoutParams(-1,dp(58)));

                  Button main=button("🌐 فتح لوحة Huawei"); main.setOnClickListener(v->open("/")); root.addView(main);
                  Button dev=button("⚙️ الترددات والباندات / Developer Mode"); dev.setOnClickListener(v->open("/#/developermode")); root.addView(dev);
                  Button cell=button("📊 معلومات الإشارة والخلية"); cell.setOnClickListener(v->open("/#/cellinfo")); root.addView(cell);
                  Button net=button("📶 إعدادات 4G / 5G"); net.setOnClickListener(v->open("/#/netmode")); root.addView(net);
                  Button wifi=button("📡 Wi‑Fi والأجهزة المتصلة"); wifi.setOnClickListener(v->open("/")); root.addView(wifi);

                  TextView note=title("الهاتف يجب أن يكون متصلًا بشبكة الراوتر.\nبعض مسارات القفل تختلف حسب Firmware؛ التطبيق يفتح واجهة Huawei الفعلية.",13);
                  note.setTextColor(Color.LTGRAY); root.addView(note,new LinearLayout.LayoutParams(-1,dp(95)));
                  setContentView(root);
              }

              private String base() {
                  String s=ip.getText().toString().trim(); if(s.isEmpty()) s="192.168.8.1";
                  if(s.startsWith("http://")||s.startsWith("https://")) return s; return "http://"+s;
              }

              private void open(String path) {
                  web=new WebView(this); WebSettings s=web.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setDatabaseEnabled(true);
                  web.setWebViewClient(new WebViewClient()); setContentView(web); web.loadUrl(base()+path);
              }

              @Override public void onBackPressed() { if(web!=null && web.canGoBack()) web.goBack(); else { web=null; home(); } }
          }
          EOF

          cd android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Huawei-Router-Manager-v3
          path: android/app/build/outputs/apk/debug/app-debug.apk