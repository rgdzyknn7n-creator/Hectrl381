name: Build Huawei Router Manager APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/hectrl381/router
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/values

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "HuaweiRouterManager"
          include(":app")
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.hectrl381.router'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.hectrl381.router'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '2.0'
              }
          }
          EOF

          cat > android/app/src/main/res/xml/network_security_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true" />
          </network-security-config>
          EOF

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#2563EB</item>
                  <item name="android:statusBarColor">#0B0F14</item>
                  <item name="android:navigationBarColor">#0B0F14</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:label="Huawei Router Manager"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:networkSecurityConfig="@xml/network_security_config">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android/app/src/main/java/com/hectrl381/router/MainActivity.java <<'EOF'
          package com.hectrl381.router;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              private WebView webView;
              private EditText ipInput;
              private LinearLayout home;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  showHome();
              }

              private int dp(int v) {
                  return (int)(v * getResources().getDisplayMetrics().density + 0.5f);
              }

              private TextView label(String s, float size) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(Color.WHITE);
                  t.setGravity(Gravity.CENTER);
                  t.setPadding(dp(8), dp(8), dp(8), dp(8));
                  return t;
              }

              private Button button(String s) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setTextSize(15);
                  b.setTextColor(Color.WHITE);
                  b.setAllCaps(false);
                  b.setBackgroundColor(Color.rgb(37, 99, 235));
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(58));
                  p.setMargins(0, dp(6), 0, dp(6));
                  b.setLayoutParams(p);
                  return b;
              }

              private void showHome() {
                  home = new LinearLayout(this);
                  home.setOrientation(LinearLayout.VERTICAL);
                  home.setGravity(Gravity.CENTER_HORIZONTAL);
                  home.setPadding(dp(20), dp(24), dp(20), dp(20));
                  home.setBackgroundColor(Color.rgb(11,15,20));

                  TextView title = label("📡 Huawei Router Manager", 25);
                  home.addView(title, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(70)));

                  TextView sub = label("H158-381 • تحكم متقدم بالراوتر", 17);
                  sub.setTextColor(Color.LTGRAY);
                  home.addView(sub, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(55)));

                  ipInput = new EditText(this);
                  ipInput.setSingleLine(true);
                  ipInput.setText("192.168.8.1");
                  ipInput.setTextColor(Color.WHITE);
                  ipInput.setHintTextColor(Color.GRAY);
                  ipInput.setHint("عنوان IP للراوتر");
                  ipInput.setGravity(Gravity.CENTER);
                  home.addView(ipInput, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(60)));

                  Button main = button("🌐 لوحة تحكم الراوتر");
                  main.setOnClickListener(v -> openPath("/"));
                  home.addView(main);

                  Button bands = button("📶 قفل الترددات والباندات");
                  bands.setOnClickListener(v -> openPath("/#/developermode"));
                  home.addView(bands);

                  Button signal = button("📊 معلومات الإشارة والخلية");
                  signal.setOnClickListener(v -> openPath("/#/cellinfo"));
                  home.addView(signal);

                  Button wifi = button("📡 إعدادات Wi‑Fi والأجهزة");
                  wifi.setOnClickListener(v -> openPath("/"));
                  home.addView(wifi);

                  TextView note = label(
                          "مهم: يجب أن يكون الهاتف متصلًا بشبكة الراوتر.\\n" +
                          "صفحة قفل الترددات تستخدم واجهة Huawei الأصلية، لذلك أي تغيير يتم تطبيقه مباشرة على الراوتر.", 14);
                  note.setTextColor(Color.rgb(160,170,185));
                  home.addView(note, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(110)));

                  setContentView(home);
              }

              private String base() {
                  String ip = ipInput.getText().toString().trim();
                  if (ip.isEmpty()) ip = "192.168.8.1";
                  if (ip.startsWith("http://") || ip.startsWith("https://")) return ip;
                  return "http://" + ip;
              }

              private void openPath(String path) {
                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  s.setLoadsImagesAutomatically(true);
                  webView.setWebViewClient(new WebViewClient());
                  setContentView(webView);
                  webView.loadUrl(base() + path);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null) {
                      if (webView.canGoBack()) {
                          webView.goBack();
                          return;
                      }
                      webView = null;
                  }
                  showHome();
              }
          }
          EOF

          cd android
          gradle wrapper --gradle-version 8.9
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Huawei-Router-Manager-v2
          path: android/app/build/outputs/apk/debug/app-debug.apk
