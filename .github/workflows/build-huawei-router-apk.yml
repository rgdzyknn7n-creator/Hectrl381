name: Build Huawei Router Manager APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix H158-381 login fallback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/hectrl381/router/MainActivity.java')
          s = p.read_text(encoding='utf-8')

          login = r'''    private void login() throws Exception{
              Exception last=null;
              for(int attempt=0;attempt<3;attempt++){
                  try{
                      initSession();
                      HttpResult state=request("GET","/api/user/state-login",null,false);
                      String st=firstNonEmpty(tag(state.body,"State"),tag(state.body,"state"));
                      if("0".equals(st)){
                          String u=firstNonEmpty(tag(state.body,"Username"),tag(state.body,"username"));
                          if(u.isEmpty()||username.equalsIgnoreCase(u))return;
                      }

                      // H158-381 firmware can reject the SCRAM challenge with 125003
                      // even when the session is valid. In that case immediately try the
                      // legacy login endpoint with a freshly initialized session.
                      try{
                          scramLogin();
                          verifyLoggedIn();
                          return;
                      }catch(Exception scramError){
                          last=scramError;
                      }

                      try{
                          initSession();
                          legacyLogin();
                          verifyLoggedIn();
                          return;
                      }catch(Exception legacyError){
                          last=legacyError;
                      }
                  }catch(Exception e){
                      last=e;
                  }
              }
              throw last==null?new Exception("تعذر تسجيل الدخول"):last;
          }

'''
          s,n=re.subn(r'    private void login\(\) throws Exception\{.*?    private void scramLogin\(\) throws Exception\{', login+'    private void scramLogin() throws Exception{', s, count=1, flags=re.S)
          if n!=1:
              raise SystemExit('login block not found')

          # Use the Huawei legacy password derivation used by the working H158-381 build.
          s=s.replace('String hashed=base64Sha256(password);String passwordValue=base64Sha256(username+hashed+token);', 'String hashed=base64Sha256(hexSha256(password));String passwordValue=base64Sha256(username+hashed+token);', 1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Build real Android APK
        shell: bash
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Huawei-Router-Manager-v9
          path: app/build/outputs/apk/debug/app-debug.apk
